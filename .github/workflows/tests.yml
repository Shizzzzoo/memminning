name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python-version: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit tests (no desktop mutations or downloads)
        run: python -m unittest discover -s tests -v
      - name: Compile Python sources
        run: python -m compileall -q memminning run.py install.py tests scripts
      - name: Check documentation links
        run: python scripts/check_doc_links.py
  gtk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install native UI test dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 dbus-x11 xvfb
      - name: GTK interactions with isolated state and simulated actions
        env:
          GSK_RENDERER: cairo
        run: dbus-run-session -- xvfb-run -a /usr/bin/python3 tests/gui_interactions.py
